name: Release Harbor DB

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
          - runner: macos-15-intel
            platform: mac
            arch: x64
          - runner: macos-15
            platform: mac
            arch: arm64
          - runner: windows-2025
            platform: win
            arch: x64
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: '24', cache: npm }
      - name: Validate release version and native runner
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const version = JSON.parse(readFileSync('package.json', 'utf8')).version;
          if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(version) || process.env.RELEASE_TAG !== `v${version}`) {
            throw new Error('Release tag must exactly match v + package.json version.');
          }
          if (process.arch !== process.env.EXPECTED_ARCH) throw new Error(`Unexpected runner architecture: ${process.arch}`);
          NODE
      - run: npm ci
      - run: npm run build
      - name: Create native installers
        run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - name: Upload installers for the release job
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: harbor-dist-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.dmg
            release/*.zip
            release/*.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish complete release
    needs: [verify, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: '24', package-manager-cache: false }
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: harbor-dist-*
          merge-multiple: true
          path: artifacts
      - name: Require all seven installers and calculate SHA-256
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { createReadStream } from 'node:fs';
          import { readFile, readdir, stat, writeFile } from 'node:fs/promises';
          const { version } = JSON.parse(await readFile('package.json', 'utf8'));
          if (process.env.RELEASE_TAG !== `v${version}`) throw new Error('Release version mismatch.');
          const suffixes = ['linux-x86_64.AppImage', 'linux-amd64.deb', 'mac-x64.dmg', 'mac-x64.zip', 'mac-arm64.dmg', 'mac-arm64.zip', 'win-x64.exe'];
          const expected = suffixes.map(suffix => `Harbor-DB-${version}-${suffix}`).sort();
          const actual = (await readdir('artifacts')).sort();
          if (JSON.stringify(actual) !== JSON.stringify(expected)) throw new Error(`Installer set is incomplete or unexpected: ${actual.join(', ')}`);
          const lines = [];
          for (const name of expected) {
            if ((await stat(`artifacts/${name}`)).size < 100000) throw new Error(`Installer is unexpectedly small: ${name}`);
            const hash = createHash('sha256');
            for await (const chunk of createReadStream(`artifacts/${name}`)) hash.update(chunk);
            lines.push(`${hash.digest('hex')}  ${name}`);
          }
          await writeFile('artifacts/SHA256SUMS', lines.join('\n') + '\n');
          const docs = `https://github.com/${process.env.GH_REPO}/blob/${process.env.RELEASE_TAG}/docs/RELEASE.md`;
          await writeFile('release-notes.md', `Harbor DB ${version}: a local desktop workspace for PostgreSQL, MariaDB, and Redis.\n\nDownload the installer matching your operating system and architecture from Assets below. macOS includes separate Intel (x64) and Apple Silicon (arm64) builds and requires macOS 13 or later. SHA256SUMS covers all seven installers.\n\nThese builds have no verified publisher certificate: Windows is unsigned, and macOS uses an ad-hoc signature without Apple notarization. Operating systems may show warnings or block installation according to local policy. Read the [installation and verification instructions](${docs}) before installing.\n\n`);
          NODE
      - name: Add generated change notes
        run: gh api --method POST "repos/$GH_REPO/releases/generate-notes" -f "tag_name=$RELEASE_TAG" --jq .body >> release-notes.md
      - name: Upload everything to a draft, then publish
        shell: bash
        run: |
          if state=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$state" != true ]]; then
              echo 'This release is already public; publish fixes under a new version instead of replacing downloads.' >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Harbor DB $RELEASE_TAG" --notes-file release-notes.md
          fi
          gh release edit "$RELEASE_TAG" --title "Harbor DB $RELEASE_TAG" --notes-file release-notes.md
          gh release upload "$RELEASE_TAG" artifacts/* --clobber
          if [[ "$RELEASE_TAG" == *-* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          fi
          gh release view "$RELEASE_TAG" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
